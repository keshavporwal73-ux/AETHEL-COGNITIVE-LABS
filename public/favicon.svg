<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.8" />
      <stop offset="60%" stopColor="#8b5cf6" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#030712" stopOpacity="0" />
    </radialGradient>
  </defs>

  {/* Background Dark Plate */}
  <rect width="120" height="120" rx="28" fill="#050814" />
  
  {/* Glow Core */}
  <circle cx="60" cy="60" r="48" fill="url(#favGlow)" />

  {/* Cybernetic Rotating Ring */}
  <circle cx="60" cy="60" r="50" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="6 8 16 8" />
  
  {/* Inner Rhombus / Quantum Hex */}
  <polygon points="60,18 98,60 60,102 22,60" stroke="url(#favGrad)" stroke-width="3" stroke-linejoin="round" fill="#090d16" fill-opacity="0.8" />
  
  {/* Hyper Core Matrix */}
  <polygon points="60,34 82,48 82,72 60,86 38,72 38,48" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" fill="#8b5cf6" fill-opacity="0.3" />
  
  {/* Convergent Laser Crossbeams */}
  <line x1="22" y1="22" x2="52" y2="52" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="98" y1="22" x2="68" y2="52" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" />
  <line x1="98" y1="98" x2="68" y2="68" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="98" x2="52" y2="68" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />

  {/* Sparkle Micro-Core */}
  <polygon points="60,46 74,60 60,74 46,60" fill="#ffffff" />
  <circle cx="60" cy="60" r="3" fill="#06b6d4" />
</svg>